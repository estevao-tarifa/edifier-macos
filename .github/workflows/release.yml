name: release

# Tag a commit (`git tag v0.1.0 && git push origin v0.1.0`) and this builds both architectures on
# Apple Silicon runners, packages `edifier-macos-<arch>.tar.gz` (a `bin/` directory with the three
# binaries, plus LICENSE and README) with a matching `.sha256`, and attaches them to the GitHub
# release. `scripts/install.sh` consumes exactly those assets.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}
      - name: Package
        run: |
          set -euo pipefail
          name="edifier-macos-${{ matrix.arch }}"
          mkdir -p "dist/$name/bin"
          cp "target/${{ matrix.target }}/release/edifierctl" \
             "target/${{ matrix.target }}/release/edifier-mcp" \
             "target/${{ matrix.target }}/release/edifier-menubar" "dist/$name/bin/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
          file "dist/$name/bin/"*
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/edifier-macos-${{ matrix.arch }}.tar.gz
            dist/edifier-macos-${{ matrix.arch }}.tar.gz.sha256
          generate_release_notes: true
