[package]
name = "edifier-menubar"
description = "macOS menu bar control surface for EDIFIER headsets (battery, ANC, EQ, game mode, LDAC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "edifier_menubar"
path = "src/lib.rs"

[[bin]]
name = "edifier-menubar"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
dispatch2 = "0.3"
edifier-link = { workspace = true }
edifier-macos = { workspace = true }
edifier-proto = { workspace = true }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
