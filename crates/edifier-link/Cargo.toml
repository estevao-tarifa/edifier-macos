[package]
name = "edifier-link"
description = "BLE transport and request/response session for Edifier headsets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
edifier-proto = { workspace = true }
btleplug = "0.11"
futures = "0.3"
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
uuid = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-bluetooth = { version = "0.3", features = ["dispatch2"] }
objc2-foundation = "0.3"
dispatch2 = "0.3"
serde.workspace = true

[dev-dependencies]
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["test-util", "rt"] }
tracing-subscriber = { workspace = true }

# The `emulate` example drives CoreBluetooth's peripheral role, which has no safe Rust binding
# outside the framework bindings.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-core-bluetooth = "0.3.2"
objc2-core-foundation = { version = "0.3", features = ["CFDate", "CFRunLoop"] }
objc2-foundation = "0.3"
