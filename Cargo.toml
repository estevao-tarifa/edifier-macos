[workspace]
resolver = "2"
members = [
    "crates/edifier-proto",
    "crates/edifier-link",
    "crates/edifierctl",
    "crates/edifier-macos",
    "crates/edifier-mcp",
    "crates/edifier-menubar",



]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "process"] }
edifier-proto = { path = "crates/edifier-proto" }
edifier-link = { path = "crates/edifier-link" }
edifier-macos = { path = "crates/edifier-macos" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
